name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/.[core,dev]"

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: |
          cd backend
          mypy engine/ api/

      - name: Verify vendored manifest
        run: |
          python tools/vendored_manifest.py --check

      - name: Verify conformance document
        run: |
          python tools/check_conformance.py --check

      - name: Verify progress dashboard
        run: |
          python tools/progress.py
          git diff --exit-code IMPLEMENTATION_PLAN.md

      - name: Test (pytest)
        run: |
          cd backend
          pytest tests/ -v --tb=short --maxfail=20 -ra -m "not real_data"

  frontend:
    runs-on: ubuntu-latest
    # Skip until Phase 8
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Test
        run: |
          cd frontend
          npm run test -- --run
